loadsurface_detector_node:
  ros__parameters:
    # ---- トピック ----
    input_topic: "/camera/depth/points"
    ground_topic: "ground/points"            # 路面（走行可能領域）の点群
    obstacle_topic: "lowobstacles/points"        # 路面以外（障害物候補）の点群
    hull_topic: "drivable_area/polygon"       # 路面点群の凸包（走行可能領域の境界）
    publish_ground: true
    publish_obstacles: true
    publish_drivable_polygon: true

    # ---- 座標系 ----
    # 路面は base_frame_id の XY 平面付近・Z-up であることを前提とする（REP-105準拠）。
    # 入力点群のフレームが異なる場合は TF (sensor_frame -> base_frame_id) で変換してから処理する。
    base_frame_id: "base_link"
    tf_timeout_sec: 0.2

    # ---- ロボット前方 ROI による事前絞り込み ----
    # base_frame_id（REP-103準拠: X=前方, Y=左, Z=上）での範囲 [m]。
    # 既定は「ロボット直前(0m)〜前方5m、左右3m、高さ±0.3m」。
    # 壁・天井・遠方や側方の誤検出対策、および処理の高速化を兼ねる。
    use_roi_filter: true
    min_x: 0.0    # 前方（ロボット直前から）
    max_x: 10.0    # 前方5m程度まで
    min_y: -3.0   # 右
    max_y: 3.0    # 左
    min_z: -1.5
    max_z: 0.0 #-0.75 #地面の高さ
    #max_z: -0.8 #-0.75 #地面の高さ
    #min_z: -15.0
    #max_z: 0.0 #-0.75 #地面の高さ

    # ---- 前処理（ダウンサンプリング） ----
    use_voxel_filter: true
    voxel_leaf_size: 0.05   # [m]

    # ---- RANSAC 平面抽出 ----
    distance_threshold: 0.03   # [m] 路面とみなす距離のしきい値
    max_iterations: 200
    optimize_coefficients: true
    min_plane_points: 100      # これ未満の inlier 数なら「路面なし」扱い

    # ---- 法線方向の拘束（路面はほぼ水平＝base_frame_id の Z 軸に垂直、という前提） ----
    use_perpendicular_constraint: true
    axis_x: 0.0
    axis_y: 0.0
    axis_z: 1.0
    eps_angle_deg: 15.0   # 軸からの許容角度（傾斜・凹凸のある路面向けに少し緩め）

    # ---- 障害物検知の対象範囲（路面 ROI とは独立に設定可能） ----
    # base_frame_id（X=前方, Y=左, Z=上）での範囲 [m]。既定は「ロボット手前〜前方2m、左右1.5m、
    # 高さ-0.3〜1.5m」。ロボットの制動距離・車幅・想定する障害物の高さに合わせて調整する。
    # 範囲内の点は「検出した路面平面からの距離」で障害物かどうかを判定する
    # （obstacle_distance_threshold より離れていれば障害物候補）。
    use_obstacle_roi_filter: true
    obstacle_min_x: 0.1    # 前方（ロボット直前から）
    obstacle_max_x: 2.0 #1.5    # 前方1.5m程度まで（近距離の障害物検知向け）
    obstacle_min_y: -3.0 #-1.5   # 右
    obstacle_max_y: 3.0    # 左
    obstacle_min_z: -0.75
    #obstacle_max_z: -0.7    # 路面 ROI より高く取り、背の高い障害物も拾えるようにする
    obstacle_max_z: 0.0    # 路面 ROI より高く取り、背の高い障害物も拾えるようにする
    
    obstacle_distance_threshold: 0.05   # [m] 路面平面からこれ以上離れていれば障害物とみなす

